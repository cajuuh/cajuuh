name: Update GitHub Activity

on:
  schedule:
    # Runs every hour
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/activity.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Update Recent Activity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Activity Section
        uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: "chore: update recent open source activity [skip ci]"
          MAX_LINES: 5
