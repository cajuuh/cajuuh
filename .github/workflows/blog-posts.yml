name: Latest Blog Posts

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/blog-posts.yml"

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and update blog posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          # You can add comma-separated RSS feeds here (e.g. Substack, Medium, Raindrop, personal blog)
          feed_list: "https://dev.to/feed/cajuuh"
          max_post_count: 5
          date_format: "mmm d, yyyy"
          template: "$newline- [$title]($url) ($date)"
